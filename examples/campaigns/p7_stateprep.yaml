# Run: python examples/run_campaign.py examples/campaigns/p7_stateprep.yaml --out results/p7_stateprep
name: p7_stateprep
description: >
  Pillar 2 tier T2 records of two-dimensional Navier-Stokes (R10), both forms, with the minimax
  filter: the prepared state's infidelity against the physical subspace's classical reference, and
  its decoded field.
groups:
  - problems: [R10a-M12, R10b-M12, R10c-M12, R10d-M12, R10d-M12-W8]
    carleman: [2, 3]
    n: [4]
    stage: stateprep
    regime: standard
    filter: minimax
  - problems: [R10a-M12, R10b-M12, R10c-M12, R10d-M12, R10d-M12-W8]
    carleman: [2, 3]
    n: [4]
    stage: stateprep
    regime: descriptor
    filter: minimax
    memory: 64
    hours: 12
  - problems: [R10a-M20, R10c-M20, R10a-M48, R10c-M48]
    carleman: 2
    n: [4]
    stage: stateprep
    regime: standard
    filter: minimax
    memory: 128
    hours: 12
  - problems: [R10b-M12, R10c-M12]
    carleman: 4
    n: [4]
    stage: stateprep
    regime: standard
    filter: minimax
    memory: 128
    hours: 12
  - problems: [R10a-M20, R10c-M20, R10a-M48, R10c-M48]
    carleman: 2
    n: [4]
    stage: stateprep
    regime: descriptor
    filter: minimax
    memory: 128
    hours: 12
  - problems: [R10b-M12, R10c-M12]
    carleman: 4
    n: [4]
    stage: stateprep
    regime: descriptor
    filter: minimax
    memory: 128
    hours: 12
