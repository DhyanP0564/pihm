# Run: python examples/run_campaign.py examples/campaigns/p4_t3.yaml --out results/p4_t3
name: p4_t3
description: >
  Standard-form Pillar 2 tier T3 records: the resources a GQSP preparation needs for R1 and every
  panel of R2 to R6, both variants, at n = 2 to 5 per axis, which include every printed n.
groups:
  - problems: [R1]
    n: [2, 3, 4, 5, 6]
    stage: stateprep
    tier: T3

  - problems: [R2, R3, R4, R5, R6]
    variants: [faithful, corrected]
    n: [2, 3, 4, 5]
    stage: stateprep
    tier: T3
