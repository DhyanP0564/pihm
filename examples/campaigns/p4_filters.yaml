# Run: python examples/run_campaign.py examples/campaigns/p4_filters.yaml --out results/p4_filters
name: p4_filters
description: >
  Standard-form filter comparison: QITE and the minimax edge filter held to equal infidelity on
  R1 and every panel of R2 to R6 at the resolutions tier T2 reaches.
groups:
  - problems: [R1]
    n: [2, 3, 4, 5]
    stage: filters

  - problems: [R2, R3, R4, R5, R6]
    variants: [corrected]
    n: [2]
    stage: filters

  - problems: [R2, R3, R4, R5, R6a]
    variants: [corrected]
    n: [3]
    stage: filters
