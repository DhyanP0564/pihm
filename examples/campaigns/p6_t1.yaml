# Run: python examples/run_campaign.py examples/campaigns/p6_t1.yaml --out results/p6_t1
name: p6_t1
description: >
  Pillar 2 tier T1 records of the first-order systems (R7, R8's Carleman lifts at K = 2 and 3,
  and R9's smallest), both forms, at n = 2, one run per initial-state candidate, checked against
  tier T2.
