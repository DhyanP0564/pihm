# Run: python examples/run_campaign.py examples/campaigns/p5_stateprep.yaml --out results/p5_stateprep
name: p5_stateprep
description: >
  Pillar 2 tier T2 records of the regime comparison: the minimax filter at each form's circuit
  alpha_R, GQSP phases and the prepared state's infidelity, for R1 to R5 in the standard and the
  descriptor form, checked against each form's classical reference.
groups:
  - problems: [R1, R2, R4b, R4c, R4d]
    n: {from: 2, to: 8}
    stage: stateprep
    regime: descriptor
    filter: minimax

  - problems: [R3a, R3b, R3c, R4a]
    n: {from: 2, to: 7}
    stage: stateprep
    regime: descriptor
    filter: minimax

  - problems: [R3d]
    n: {from: 2, to: 6}
    stage: stateprep
    regime: descriptor
    filter: minimax

  - problems: [R5a, R5c]
    n: [2, 3, 4]
    stage: stateprep
    regime: descriptor
    filter: minimax

  - problems: [R5b]
    n: [2, 3, 4, 5]
    stage: stateprep
    regime: descriptor
    filter: minimax

  - problems: [R1]
    n: [2, 3, 4, 5]
    stage: stateprep
    filter: minimax

  - problems: [R2a, R2b, R2c, R4a, R5a, R5c]
    n: [2, 3]
    stage: stateprep
    filter: minimax

  - problems: [R3, R4b, R4c, R4d, R5b]
    n: [2, 3, 4]
    stage: stateprep
    filter: minimax

  # Every T1 case (p5_t1), one run per initial state: T2's predicted p for the candidate a T1
  # record simulates, which the T1 record's measured probability is compared with.
  - problems: [R1]
    n: [2, 3, 4]
    stage: stateprep
    regime: descriptor
    filter: minimax
    geometric_r: [0.5]
    label: per candidate

  - problems: [R1]
    n: [2, 3, 4]
    stage: stateprep
    regime: descriptor
    filter: minimax
    geometric_r: [-0.5]
    label: per candidate

  - problems: [R2, R3, R4]
    n: [2, 3]
    stage: stateprep
    regime: descriptor
    filter: minimax
    geometric_r: [0.5]
    label: per candidate

  - problems: [R2, R3, R4]
    n: [2, 3]
    stage: stateprep
    regime: descriptor
    filter: minimax
    geometric_r: [-0.5]
    label: per candidate

  - problems: [R5]
    n: [2]
    stage: stateprep
    regime: descriptor
    filter: minimax
    geometric_r: [0.5]
    label: per candidate

  - problems: [R5]
    n: [2]
    stage: stateprep
    regime: descriptor
    filter: minimax
    geometric_r: [-0.5]
    label: per candidate

  - problems: [R1]
    n: [2, 3, 4]
    stage: stateprep
    filter: minimax
    geometric_r: [0.5]
    label: per candidate

  - problems: [R1]
    n: [2, 3, 4]
    stage: stateprep
    filter: minimax
    geometric_r: [-0.5]
    label: per candidate

  - problems: [R2, R3, R4, R5]
    n: [2]
    stage: stateprep
    filter: minimax
    geometric_r: [0.5]
    label: per candidate

  - problems: [R2, R3, R4, R5]
    n: [2]
    stage: stateprep
    filter: minimax
    geometric_r: [-0.5]
    label: per candidate

  # The controls on the initial state, beside the geometric state: the uniform state
  # and one random state per run (seeded by the run's configuration hash), in each form.
  - problems: [R1, R2, R3, R4, R5]
    n: [2, 3]
    stage: stateprep
    regime: descriptor
    filter: minimax
    kind: uniform
    label: initial-state control

  - problems: [R1, R2, R3, R4, R5]
    n: [2, 3]
    stage: stateprep
    regime: descriptor
    filter: minimax
    kind: random
    label: initial-state control

  - problems: [R1, R2, R3, R4, R5]
    n: [2, 3]
    stage: stateprep
    filter: minimax
    kind: uniform
    label: initial-state control

  - problems: [R1, R2, R3, R4, R5]
    n: [2, 3]
    stage: stateprep
    filter: minimax
    kind: random
    label: initial-state control
