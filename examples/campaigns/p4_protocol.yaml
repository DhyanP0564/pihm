# Run: python examples/run_campaign.py examples/campaigns/p4_protocol.yaml --out results/p4_protocol
name: p4_protocol
description: >
  Standard-form Pillar 2 protocol variants: tier T2 with the gap's imaginary time, the gap
  underestimated x2 and x10, and the paper's own time rule, for R1 and every linear rung.
groups:
  - problems: [R1]
    n: [2, 3, 4]
    stage: protocol

  - problems: [R2, R3, R4, R5]
    variants: [corrected]
    n: [2, 3]
    stage: protocol
